<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>장단 / Jangdan — 기기 뷰</title>
<style>
  /* ebiten이 canvas를 body 끝에 붙이며 width/height 100%를 인라인으로 건다.
     위치·z-index만 여기서 잡는다: still(0) < canvas(1) < overlay(10). */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #still { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  canvas { position: absolute; inset: 0; z-index: 1; }
  #overlay {
    position: absolute; top: 8px; left: 8px; z-index: 10;
    display: flex; gap: 4px; align-items: center;
    font: 12px system-ui, sans-serif;
  }
  #seedbox { display: none; width: 140px; }
  #seedbox.show { display: block; }
  /* 시드 단어 표시 — 캔버스 폰트는 ASCII라서 한글은 DOM이 담는다. */
  #seedtext {
    position: absolute; left: 0; right: 0; bottom: 40px; z-index: 10;
    pointer-events: none; text-align: center;
    font: 14px system-ui, sans-serif; color: rgba(232, 226, 210, 0.7);
  }
</style>
</head>
<body>
<img id="still" src="still.png" alt="장단 기기">
<div id="overlay">
  <button id="seedtoggle">seed</button>
  <input id="seedbox" type="text" placeholder="seed word" autocomplete="off">
</div>
<div id="seedtext"></div>
<script src="report-config.js"></script>
<script src="host.js"></script>
<div id="tools" style="position:absolute;right:8px;bottom:8px;z-index:10;display:flex;gap:6px;font:12px system-ui">
  <button id="replay" style="padding:6px 10px;opacity:.85" onclick="window.jd.replay(15) ? this.textContent='3·2·1…' : this.textContent='replay n/a'; setTimeout(()=>this.textContent='replay 15s', 20000)">replay 15s</button>
  <button id="clean" style="padding:6px 10px;opacity:.85" onclick="this.textContent = window.jd.setCleanScreen(!window.jd.cleanScreen()) ? 'clean: on' : 'clean'">clean</button>
  <button id="share" style="padding:6px 10px;opacity:.85" onclick="(async()=>{const u=window.jdShareURL&&window.jdShareURL(); if(!u){this.textContent='share n/a';return;} const full=location.origin+location.pathname+'?s='+u; try{await navigator.clipboard.writeText(full); this.textContent='copied '+u.length+'ch';}catch(e){prompt('share URL', full);} })()">share</button>
  <button id="sendreport" style="padding:6px 10px;opacity:.85" onclick="window.jdSendReport().then(t=>this.textContent=t)">Send report</button>
</div>
<style>body.clean #overlay, body.clean #tools { display: none; }</style>
<script src="wasm_exec.js"></script>
<script>
  const go = new Go();
  // GitHub Pages는 Content-Encoding 사전압축을 못 한다 → app.wasm.gz를 받아 브라우저에서 푼다(Safari 16.4+/Chrome 80+).
  // DecompressionStream이 없거나 .gz가 없으면 raw app.wasm으로 폴백.
  async function loadWasm(importObject) {
    if ('DecompressionStream' in window) {
      try {
        const r = await fetch('app.wasm.gz');
        if (r.ok) {
          const body = r.body.pipeThrough(new DecompressionStream('gzip'));
          return await WebAssembly.instantiateStreaming(new Response(body, { headers: { 'Content-Type': 'application/wasm' } }), importObject);
        }
      } catch (e) { console.warn('app.wasm.gz 경로 실패, raw로 폴백:', e); }
    }
    return WebAssembly.instantiateStreaming(fetch('app.wasm'), importObject);
  }
  loadWasm(go.importObject).then((r) => {
    window.__jdStatsSet('tWasmLoaded', performance.now());
    return go.run(r.instance);
  }).catch((e) => console.error('app.wasm 로드 실패:', e));
</script>
</body>
</html>
